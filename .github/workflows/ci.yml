name: ElmTUI verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lisp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SBCL 2.6.2 and prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl bzip2 ca-certificates git tar tmux
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o sbcl.tar.bz2 \
            https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.2/sbcl-2.6.2-x86-64-linux-binary.tar.bz2
          echo "1758d003f60fa166db014999a73cf9af02726ca7803ab9057dec32a92e2b6322  sbcl.tar.bz2" | sha256sum -c -
          tar -xjf sbcl.tar.bz2
          (cd sbcl-2.6.2-x86-64-linux && sudo sh install.sh)
          sbcl --version
      - name: Install CLPM 0.4.1 and verify its SHA512
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/clpm.tar.gz https://files.clpm.dev/clpm/clpm-0.4.1-linux-amd64.tar.gz
          curl -fsSL --retry 3 -o /tmp/clpm.DIGESTS https://files.clpm.dev/clpm/clpm-0.4.1.DIGESTS
          expected=$(grep 'clpm-0.4.1-linux-amd64.tar.gz' /tmp/clpm.DIGESTS | awk '{print $1}')
          test -n "$expected"
          echo "$expected  /tmp/clpm.tar.gz" | sha512sum --check
          mkdir -p /tmp/clpm-unpack
          tar -xzf /tmp/clpm.tar.gz -C /tmp/clpm-unpack
          cd /tmp/clpm-unpack/clpm-0.4.1-linux-amd64
          sudo sh ./install.sh
      - name: Install locked bundle
        run: clpm bundle install
      - name: Configure SBCL for CI (ASDF + log4cl package unlocks)
        run: |
          cat > "$HOME/.sbclrc" <<'SBCLRC'
          (require :asdf)
          (dolist (p '(:sb-c :sb-pcl :sb-int :sb-kernel))
            (let ((pkg (find-package p)))
              (when pkg (sb-ext:unlock-package pkg))))
          SBCLRC
      - name: Verify cold ASDF compilation and package prerequisites
        run: clpm bundle exec --with-client sbcl -- --noinform --non-interactive --eval '(asdf:compile-system :elmtui :force t)'
      - name: Verify exported symbol identities and facade manifest
        run: python3 scripts/audit-facade-exports.py
      - name: Run FiveAM regression suite
        run: clpm bundle exec --with-client sbcl -- --noinform --non-interactive --load run-tests-clpm.lisp
      - name: Verify independent subproject bundles and public dependency direction
        run: scripts/test-subproject-bundles.sh
      - name: Verify reusable libraries inside the root CLPM bundle
        run: scripts/test-subsystems.sh
      - name: Generate API reference
        run: scripts/build-api-docs.sh
      - name: Reject stale checked-in public API references
        run: git diff --exit-code -- docs/api/generated/api.md docs/api/generated/api.html
      - name: Test API reference qualification guards
        run: python3 -m unittest discover -s tests/reference -p 'test_*.py' -v
      - name: Qualify API reference structure against live exports
        run: python3 scripts/qualify-api-reference.py --structure-only
      - name: Enforce public-docstring debt threshold
        run: scripts/check-docstrings.sh
      - name: Neon unit tests
        run: |
          clpm bundle exec --with-client sbcl -- --noinform --non-interactive \
            --eval '(asdf:test-system "elmtui-neon-tests")'
      - name: Workbench independent tests
        run: python3 -m unittest discover -s tests/workbench/independent -p 'test_*.py' -v
      - name: Workbench real PTY
        run: python3 tests/workbench/pty-workbench.py
