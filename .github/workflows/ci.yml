name: ElmTUI verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lisp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SBCL 2.6.2 and prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl bzip2 ca-certificates git tar tmux ripgrep \
            xvfb rxvt-unicode xdotool
          cd "$RUNNER_TEMP"
          curl -fLsS --retry 3 -o sbcl.tar.bz2 \
            https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.2/sbcl-2.6.2-x86-64-linux-binary.tar.bz2
          echo "1758d003f60fa166db014999a73cf9af02726ca7803ab9057dec32a92e2b6322  sbcl.tar.bz2" | sha256sum -c -
          tar -xjf sbcl.tar.bz2
          (cd sbcl-2.6.2-x86-64-linux && sudo sh install.sh)
          sbcl --version
      - name: Install CLPM 0.4.1 and verify its SHA512
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/clpm.tar.gz https://files.clpm.dev/clpm/clpm-0.4.1-linux-amd64.tar.gz
          curl -fsSL --retry 3 -o /tmp/clpm.DIGESTS https://files.clpm.dev/clpm/clpm-0.4.1.DIGESTS
          expected=$(grep 'clpm-0.4.1-linux-amd64.tar.gz' /tmp/clpm.DIGESTS | awk '{print $1}')
          test -n "$expected"
          echo "$expected  /tmp/clpm.tar.gz" | sha512sum --check
          mkdir -p /tmp/clpm-unpack
          tar -xzf /tmp/clpm.tar.gz -C /tmp/clpm-unpack
          cd /tmp/clpm-unpack/clpm-0.4.1-linux-amd64
          sudo sh ./install.sh
      - name: Install locked bundle
        run: clpm bundle install
      - name: Configure SBCL for CI (ASDF + log4cl package unlocks)
        run: |
          cat > "$HOME/.sbclrc" <<'SBCLRC'
          (require :asdf)
          (dolist (p '(:sb-c :sb-pcl :sb-int :sb-kernel))
            (let ((pkg (find-package p)))
              (when pkg (sb-ext:unlock-package pkg))))
          SBCLRC
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation build dependencies
        run: python -m pip install 'mkdocs-material>=9.5,<10'
      - name: Run the canonical release gate
        # One definition of "ready": CI executes exactly what a maintainer runs.
        # Per-gate logs and the matrix receipt land in ELMTUI_RELEASE_RECEIPT_DIR.
        env:
          ELMTUI_RELEASE_RECEIPT_DIR: ${{ runner.temp }}/release-receipts
          ELMTUI_WORKBENCH_TEST_CMD: ./scripts/examples.sh run repl
        run: scripts/release-check.sh
      - name: Upload release receipts and coverage evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            ${{ runner.temp }}/release-receipts/
            coverage/
            test-output/coverage-*.log
          if-no-files-found: warn
