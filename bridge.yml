version: 1
name: elmtui-clpm

env:
  CLPM_HOME: .cache/clpm

default_track: clpm

tracks:
  clpm:
    description: Run elmtui through the repository CLPM bundle
    steps:
      - name: ensure-bundle
        run: |
          mkdir -p .cache/clpm
          clpm bundle install
      - name: run-tests
        run: |
          clpm bundle exec --with-client sbcl -- --noinform --load run-tests-clpm.lisp

  clpm-dev:
    description: Run ElmTUI development tools through the optional CLPM bundle
    steps:
      - name: ensure-dev-bundle
        run: |
          mkdir -p .cache/clpm
          clpm bundle -f dev/clpmfile install

commands:
  test:
    track: clpm
    run: |
      clpm bundle exec --with-client sbcl -- --noinform --load run-tests-clpm.lisp

  warning-clean:
    track: clpm
    run: |
      scripts/run-tests-warning-clean.sh

  test-subsystems:
    track: clpm
    run: |
      scripts/test-subsystems.sh

  release-check:
    track: clpm
    run: |
      scripts/release-check.sh

  repl:
    track: clpm
    run: |
      clpm bundle exec --with-client sbcl -- --noinform --load run_clpm.lisp

  slynk:
    track: clpm-dev
    run: |
      clpm bundle -f dev/clpmfile exec --with-client sbcl -- --noinform --load run_clpm_slynk.lisp

  coverage:
    track: clpm
    run: |
      set -eu
      mkdir -p test-output
      log="test-output/coverage-warning-clean.log"
      if ! clpm bundle exec --with-client sbcl -- --noinform --non-interactive --load coverage.lisp >"$log" 2>&1; then
        cat "$log"
        exit 1
      fi
      cat "$log"
      test -s coverage/cover-index.html
      if grep -nE '(^|[[:space:]])(STYLE-)?WARNING:' "$log"; then
        echo "coverage: warning marker detected" >&2
        exit 1
      fi

  examples-smoke:
    track: clpm
    run: |
      clpm bundle exec --with-client sbcl -- --noinform --non-interactive \
        --eval '(require :asdf)' \
        --eval '(asdf:load-system "elmtui-tests")' \
        --eval '(fiveam:run! '\''elmtui.tests.examples-smoke:examples-smoke-tests)'

  benchmark:
    track: clpm
    run: |
      clpm bundle exec --with-client sbcl -- --noinform --non-interactive \
        --eval '(require :asdf)' \
        --eval '(asdf:load-system "elmtui-dev")' \
        --eval '(elmtui.dev.benchmark:run-benchmark-suite)'

  benchmark-test:
    track: clpm
    run: |
      clpm bundle exec --with-client sbcl -- --noinform --non-interactive \
        --eval '(require :asdf)' \
        --eval '(asdf:load-system "elmtui-dev-tests")' \
        --eval '(elmtui.dev.benchmark.tests:run-benchmark-tests)'

  docs:
    track: clpm
    run: |
      scripts/build-api-docs.sh

  doc-audit:
    track: clpm
    run: |
      scripts/check-docstrings.sh

  doc-audit-strict:
    track: clpm
    run: |
      ELMTUI_DOCSTRING_STRICT=1 scripts/check-docstrings.sh
